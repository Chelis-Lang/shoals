name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: shoals
  # Literal chelis pin. MUST equal reef.toml `compiler = "=X.Y.Z"`;
  # scripts/audit_workarounds.py --pins-only enforces it offline. The extract
  # step re-derives from reef.toml only to assert this has not drifted.
  CHELIS_TAG: v0.19.1
  CHELIS_VERSION: 0.19.1

jobs:
  build-reef-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        id: versions
        run: |
          # chelis pin comes from the literal top-level env; re-derive from
          # reef.toml only to assert it has not drifted (reef.toml is truth).
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          PACKAGE_VERSION=$(grep -oP '^version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ] || [ -z "$SHORELEAVE_VERSION" ] || [ -z "$PACKAGE_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION" >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION shoreleave=$SHORELEAVE_VERSION shoals=$PACKAGE_VERSION"

      - name: Download chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          asset="chelis-${CHELIS_TAG}-linux-x86_64-glibc2.31.tar.gz"
          rm -rf /tmp/chelis-toolchain
          mkdir -p /tmp/chelis-toolchain
          gh release download "${CHELIS_TAG}" \
            --repo Chelis-Lang/chelis \
            --pattern "$asset" \
            --pattern "$asset.sha256" \
            --dir /tmp/chelis-toolchain
          (
            cd /tmp/chelis-toolchain
            sha256sum -c "$asset.sha256"
          )
          tar -xzf "/tmp/chelis-toolchain/$asset" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64-glibc2.31/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: test "$(chelis --version)" = "chelis ${CHELIS_VERSION}"

      - name: Install released dependencies
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: |
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: Verify release bytes converge across adversarial Reef registries (chelis#1002)
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: python3 scripts/check_release_artifact_determinism.py

      - name: Build canonical reef assets (chelis#1002)
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: python3 scripts/build_release_assets.py

      - name: Run adversarial risk invariant gate regressions
        run: python3 scripts/test_risk_invariant_gate.py

      - name: Verify complete SMT and fuzz-validated canon
        env:
          PROVE_GATE_FUZZ: "1"
        run: python3 scripts/prove_gate.py

      - name: Validate bounded pricing property-result classification
        run: python3 scripts/test_check_pricing_fix_properties.py

      - name: Check bounded pricing regressions and refute their false controls
        run: python3 scripts/check_pricing_fix_properties.py

      - name: Verify package prove latency and deterministic output (chelis#924)
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: python3 scripts/check_package_prove_latency.py

      - name: Publish the invariant-surface manifest as a release asset
        run: |
          set -euo pipefail
          # Fail closed if the manifest pkg_version disagrees with the release.
          MANIFEST_VER=$(python3 -c "import json;print(json.load(open('docs/cnote-import-surface.json'))['pkg_version'])")
          test "$MANIFEST_VER" = "$PACKAGE_VERSION" || { echo "manifest pkg_version $MANIFEST_VER != release $PACKAGE_VERSION" >&2; exit 1; }
          # Byte-identical copy of the producer manifest, named per the frozen
          # contract (<pkg>-<ver>.invariants.json). C Note vendors this asset.
          cp docs/cnote-import-surface.json \
            "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"

      - name: Seal and validate the complete release payload
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          archive="dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst"
          shell="dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.chb"
          invariant="dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"
          chelis reef verify-artifact --archive "$archive" --shell "$shell"
          (
            cd dist
            sha256sum \
              "${PACKAGE_NAME}-${PACKAGE_VERSION}.chb" \
              "${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json" \
              "${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst" \
              > "${PACKAGE_NAME}-${PACKAGE_VERSION}.sha256"
          )
          python3 scripts/build_release_assets.py
          cmp docs/cnote-import-surface.json "$invariant"
          (
            cd dist
            sha256sum -c "${PACKAGE_NAME}-${PACKAGE_VERSION}.sha256"
          )
          chelis reef verify-artifact --archive "$archive" --shell "$shell"

      - name: Verify release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "${PACKAGE_VERSION}"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.tar.zst"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.chb"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.invariants.json"
          test -f "dist/${PACKAGE_NAME}-${PACKAGE_VERSION}.sha256"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.tar.zst
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.chb
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.invariants.json
            dist/${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
