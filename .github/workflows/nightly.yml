name: nightly

# The scheduled real-chelis validation that does NOT belong on the per-PR
# path. Per-PR CI (ci.yml) stays LEAN: fmt + lint + the reef-build compile
# signal + the offline gates (hard-rule-guard, contract-gate). Everything
# real-chelis/real-SMT runs here, on two cadences:
#
#   * DAILY (03:00 UTC) — the gates moved off the per-PR path so they no
#     longer cost every PR ~17-19 min of real-chelis/real-SMT wall:
#       - `tests` : the fast deterministic unit suite (tests/; its measured
#                   cost, variance and ceiling are at the step itself).
#       - `prove` : the keystone canon self-audit (scripts/prove_gate.py,
#                   real-SMT ~8.6 min).
#       - `accuracy` : the erf64/n_cdf64 published-floor measurement and the
#                   AD-Greeks oracle (shoals#64 — both previously ran in no
#                   CI job at all, and the erf64 one was additionally broken
#                   against the current eval-JSON schema).
#   * WEEKLY (Sun 06:00 UTC) — the `heavy` matrix: the Monte-Carlo / PDE /
#     Fourier / optimization-benchmark files in tests-manual/, sharded one
#     leg per file so no single leg approaches the 2-vCPU ubuntu-latest
#     runner's reclaim window (a single-invocation run of the whole directory
#     was SIGTERM-killed, exit 143, at ~54 min before its own step timeout).
#     Deliberately not daily: it is the heaviest, most runner-hostile suite.
#   * workflow_dispatch runs ALL THREE tiers on demand.
#
# Toolchain versions are derived from reef.toml, same as ci.yml.
#
# The milestone acceptance oracles (scripts/manual_gates/phase3l_*.py) are
# a MANUAL gate — run on demand / locally, deliberately NOT scheduled in
# CI: each spawns a fresh `chelis test` that rebuilds the chelis-std +
# nautilus + coral graph (recompile-bound), the wrong shape for a CI step.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — the `tests` + `prove` gates
    - cron: '0 6 * * 0'   # 06:00 UTC Sundays (weekly) — the `heavy` matrix
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# Literal chelis pin. MUST equal reef.toml `compiler = "=X.Y.Z"`;
# scripts/audit_workarounds.py --pins-only enforces it offline. The extract
# step re-derives the pin from reef.toml only to assert this has not drifted.
env:
  CHELIS_TAG: v0.19.0
  CHELIS_VERSION: 0.19.0

jobs:
  # The fast deterministic unit suite (tests/) — moved off the per-PR path.
  # The tallest slice of the old per-PR gate: see the measured cost at the
  # `chelis test` step below, which is the authoritative figure. Runs DAILY
  # (and on workflow_dispatch). This is the per-PR-derived fast suite; the
  # heavy tests-manual/ suite is the weekly `heavy` matrix below.
  tests:
    name: tests (fast unit suite)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          # chelis pin comes from the literal top-level env; re-derive from
          # reef.toml only to assert it has not drifted (reef.toml is truth).
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ] || [ -z "$SHORELEAVE_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION"       >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION shoreleave=$SHORELEAVE_VERSION"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}-shoreleave-${{ env.SHORELEAVE_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: chelis reef build
        run: chelis reef build

      # Budget raised at the 0.18.6 pin to work around chelis#1391 -- a
      # narrowing, not a fix. On 43 files and 371 tests on one quiet 10-core
      # machine with warm caches, `--batch-mode auto` went from 3m01s to
      # 7m54s, so the old 1500s/30min budget no longer has headroom on a
      # 2-vCPU hosted runner. This raises the budget ONLY; for the current
      # batch-mode figures see the re-probe below, which supersedes the
      # 0.18.6 pair.
      #
      # MEASURED COST OF THIS STEP. This is the authoritative figure for this
      # step's hosted cost; the four comments that used to restate it now give
      # no figure of their own and point here. CHANGELOG.md and
      # docs/UPSTREAM_BUGS.md do restate the re-probe numbers below, by
      # design -- one is a release record, the other the shell contract's §4
      # surface. Nothing mechanically ties the spellings together.
      #
      # At the current `=0.18.11` pin, from the Actions API (step
      # `started_at`/`completed_at`, which excludes this job's ~60s
      # `reef build`):
      #   * head 03c63bb4, 45 files / 391 tests, EIGHT consecutive dailies
      #     2026-09-23..09-30: 1444, 2131, 1995, 2113, 2037, 1892, 1958,
      #     1986s. Mean 1944.5s, sample stdev 217s. Everything is held fixed
      #     across those eight, so RUN-TO-RUN SPREAD ALONE IS 687s, 35.3% of
      #     the mean -- 60% to 89% of this step's 2400s ceiling from one
      #     runner draw.
      #   * then 3a89c041 (45/391) 1982s; 392c7a42 (48/468) 2168s; 872da1e9
      #     (49/494) 1836s.
      #   * eleven completed runs at this pin: 1444-2168s, mean 1958s.
      #
      # AT TODAY'S 549-TEST SUITE THIS STEP DOES NOT COMPLETE. Head 69e1e59
      # has run twice, 2026-10-03 and 2026-10-04, with no merge between them,
      # and both hit the 2400s suite timeout at exactly `384 passed, 1 failed
      # (suite incomplete)` -- no test asserting wrong (shoals#111). Two runs
      # stopping at the same count is a reproducible overrun, not an unlucky
      # runner draw. The current cost is therefore bounded below by 2400s and
      # is not otherwise known.
      #
      # So the mean above is history, not the present cost, and that is the
      # caveat that matters: it averages three suite sizes (391, 468 and 494
      # tests) and NONE of them is the current one.
      #
      # The ceiling is also not newly tight, which bounds how much any single
      # change can be blamed for. At the previous `=0.18.10` pin, head
      # da6a2cd8, over the same 45 files and 391 tests and against the same
      # 2400s timeout, this step timed out on 2026-09-21 (`313 passed, 1
      # failed (suite incomplete)`) and came within 19s of it on 2026-09-22
      # (2381s). Set against a 687s same-head spread, a two-run before/after
      # comparison cannot size any one PR's contribution. Note what the
      # reproducible overrun above does and does not license, though: the
      # suite did cross for good somewhere between 494 and 549 tests, so the
      # growth is real; it is attributing a specific number of seconds to a
      # specific PR that the data does not support.
      #
      # chelis#1391 is CLOSED upstream, fixed by chelis#3058 (`04612253c`,
      # batching sharded at MAX_BATCH_FILES = 4). No release carries that fix
      # yet, so this pin still has the regression: re-measure and lower the
      # budget at the first pin that carries #3058. That same measurement is
      # what shoals#80 needs in order to cost running this suite per-PR.
      #
      # RE-PROBE, 2026-10-04 at head 69e1e59 on the `=0.18.11` release
      # binary, the current 49 files and 549 tests, one 10-core machine, both
      # legs back to back. This is the re-probe `docs/UPSTREAM_BUGS.md`
      # prescribes for this entry, and `auto` still loses:
      #   * `--batch-mode auto` : 1113s wall, 1218s child CPU -> 1.09 cores
      #   * `--batch-mode file` :  341s wall, 1264s child CPU -> 3.71 cores
      #   * 3.27x the wall for +3.8% CPU; both legs `549 passed, 0 failed`.
      # The CPU parity is what makes this a scheduling result rather than a
      # workload one: the same work, 3.27x the wall. `--batch-mode auto`
      # collapses files into batches, which leaves `--jobs` almost no
      # test-file workers to schedule; chelis#3058's own message says the
      # merged unit "ran in one subprocess whatever `--jobs` said: the
      # setting reached only the files that had been demoted out of the
      # batch", and its fix both caps batch size and extends `--jobs` to
      # shard concurrency. The ratio is larger than the 2.12x recorded at 43
      # files, but that pair differs in file count, test count AND compiler
      # release, so it does not isolate a cause.
      #
      # The CPU parity also bounds what the upstream fix will buy here.
      # chelis#3058 reports the merged-unit cost as superlinear in unit size,
      # cutting CPU 5.5x as well as wall 23.1x on a 36-file synthetic corpus.
      # This suite shows no such CPU recovery (+3.8%), so at 49 files it is
      # paying the serial cost and not the superlinear one: expect the
      # benefit in wall clock, not in runner-minutes.
      #
      # `--batch-mode file` is therefore the one lever available before a
      # release, and it is still NOT taken here. These are 10-core numbers
      # and the runner has 2 vCPU, where the parallelism `file` buys is
      # capped far lower; no hosted measurement of `file` mode exists, and
      # this comment deliberately does not project one. Measure it on the
      # runner -- `workflow_dispatch` settles it in one run -- before
      # changing what CI exercises (shoals#111).
      - name: chelis test (tests/ fast unit suite)
        timeout-minutes: 45
        run: chelis test tests/ --timeout 1200 --suite-timeout 2400 --jobs auto

  # The keystone canon self-audit against the pinned RELEASE binary — moved
  # off the per-PR path. Real-SMT ~8.6 min (the reef package load alone is
  # multi-minute; prove_gate has no cheap subset to smoke). Runs DAILY (and on
  # workflow_dispatch).
  #
  # This is the complete active canon: deterministic SMT lanes plus the
  # explicitly seeded fuzz-validated direct-pricer lane promoted when
  # chelis#659 closed at 0.17.4. The fuzz lane's expected tier, controls,
  # compiler attribution, sample budget, and counterexamples are enforced by
  # prove_gate; it is never presented as a proof.
  prove:
    name: prove-gate (canon self-audit)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION"       >> "$GITHUB_ENV"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}-shoreleave-${{ env.SHORELEAVE_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: chelis reef build
        run: chelis reef build

      - name: prove_gate (complete SMT and fuzz-validated canon)
        env:
          PROVE_GATE_FUZZ: "1"
        run: python3 scripts/prove_gate.py

      - name: Verify package prove latency and deterministic output (chelis#924)
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/check_package_prove_latency.py

  # The two numerical-accuracy oracles. Before shoals#64 they ran in NO CI job:
  # `oracle_erf64_accuracy.py` was additionally CRASHING (it read `chelis eval
  # --json` schema 2 while the pin emits schema 3's tagged carrier, a break it
  # survived unnoticed through three pin bumps), and `oracle_greeks_gate.py`
  # worked but was invoked nowhere.
  #
  # Their own job, deliberately, rather than extra steps on `tests`: appended
  # there, a red unit suite would skip them and silently restore the state this
  # issue describes. They need the pinned toolchain (they evaluate the compiled
  # kernel), so the per-PR path is closed to them by the lean-CI decision in
  # ci.yml -- the erf64 oracle's cheap offline half runs there instead.
  accuracy:
    name: accuracy-oracles (erf64 floors + AD Greeks)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION"       >> "$GITHUB_ENV"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}-shoreleave-${{ env.SHORELEAVE_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: chelis reef build
        run: chelis reef build

      # mpmath is a HARD prerequisite, not a nicety: the erf64 oracle used to
      # exit 0 when it was absent, which is how a wrong figure shipped past it.
      # It FAILS now, so this install must not be allowed to silently no-op.
      - name: Install oracle reference dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r scripts/requirements-oracle.txt
          python3 -c 'import mpmath; print("mpmath", mpmath.__version__)'

      - name: Measure the published accuracy floors
        timeout-minutes: 30
        run: python3 scripts/oracle_erf64_accuracy.py --measurement

      - name: AD-Greeks oracle gate
        timeout-minutes: 30
        env:
          # This gate SKIPs when chelis is unavailable, which is right on a
          # clean box and wrong here: the toolchain is installed above, so a
          # SKIP would mean the gate silently stopped running again.
          SHOALS_ORACLE_REQUIRE_CHELIS: "1"
        run: python3 scripts/oracle_greeks_gate.py

  heavy:
    name: heavy ${{ matrix.file }}
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - composites_binding_heavy
          - greeks_secondorder
          - heston
          - heston_heavy
          - hull_white
          - hull_white_heavy
          - lsm_heavy
          - modelfit_bfgs
          # modelfit_bfgs_heavy excluded pending chelis#408: its BFGS path
          # (mf_bfgs_rec Rosenbrock 500-iter + FD Jacobian + CG) kills the
          # 2-vCPU GitHub runner ~4min in (shutdown/lost-communication, no
          # output). Passes locally; re-add this leg when chelis#408 is fixed.
          - modelfit_pipeline
          - modelfit_pipeline_heavy
          - pde_heavy
          - rng_heavy
          - sabrpaths_heavy
          - stochastic_kou_heavy
          - trees
          - trees_heavy
          - xva_wwr_heavy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          # chelis pin comes from the literal top-level env; re-derive from
          # reef.toml only to assert it has not drifted (reef.toml is truth).
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ] || [ -z "$SHORELEAVE_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION"       >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION shoreleave=$SHORELEAVE_VERSION"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}-shoreleave-${{ env.SHORELEAVE_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: chelis reef build
        run: chelis reef build

      # One heavy file per matrix leg. `--jobs` controls cross-FILE worker
      # parallelism, so with a single file it buys no speedup — but `--jobs
      # auto` still forks worker processes that add CPU/memory pressure on the
      # 2-vCPU ubuntu-latest runner. That pressure twice killed the heaviest
      # leg with a runner-level death ("lost communication ... starves it for
      # CPU/Memory"), so pin `--jobs 1` to run in-process with no extra
      # workers; the tests in a file already run serially regardless.
      #
      # The slowest individual tests — the modelfit pipeline FD-bump (~12
      # serial 2-stage LM solves) and the 256-path SABR correlation MC — run
      # past 600s on 2 vCPUs, so the per-test budget is 1500s (the whole
      # monolith previously used 1800s without a per-test timeout). These tests
      # cannot be shrunk without weakening their numerical/statistical oracle.
      #
      # Step ceiling 30 min: a heavy leg builds + tests in ~7-23 min, and the
      # Chelis 0.17.4 also has an independent 600s whole-suite watchdog. Set it
      # to 1650s so the reviewed long-running tests can complete, while keeping
      # it below the 30-minute step ceiling. The 1500s per-test bound still
      # guards every individual oracle. A rare overrun surfaces via the report
      # job rather than being masked by a huge ceiling.
      - name: chelis test (tests-manual/${{ matrix.file }}.ch)
        timeout-minutes: 30
        run: chelis test "tests-manual/${{ matrix.file }}.ch" --timeout 1500 --suite-timeout 1650 --jobs 1

  # Surface a nightly failure as a tracking issue (opens on failure, closes
  # on green) so a red nightly is impossible to miss — scheduled-run
  # failures do not show a red status on main, which is how the heavy
  # nightly stayed red unnoticed. `needs` all three real-chelis jobs;
  # `if: always()` so it runs regardless of outcome.
  report:
    name: Surface nightly status
    needs: [tests, prove, accuracy, heavy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close nightly-failure tracking issue
        uses: actions/github-script@v7
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          PROVE_RESULT: ${{ needs.prove.result }}
          ACCURACY_RESULT: ${{ needs.accuracy.result }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
        with:
          script: |
            const title = 'Nightly failing: shoals';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Jobs that did not run on this cadence report 'skipped' (daily runs
            // skip `heavy`; the weekly run skips `tests`/`prove`) — not a
            // failure. Only success|skipped are OK; anything else (failure,
            // cancelled, timed_out) is a real nightly failure.
            const results = {
              tests: process.env.TESTS_RESULT,
              prove: process.env.PROVE_RESULT,
              accuracy: process.env.ACCURACY_RESULT,
              heavy: process.env.HEAVY_RESULT,
            };
            const failedJobs = Object.entries(results)
              .filter(([, r]) => r !== 'success' && r !== 'skipped')
              .map(([n, r]) => `${n}=${r}`);
            const failed = failedJobs.length > 0;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (failed) {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **nightly** suite failed (${failedJobs.join(', ')}).\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the nightly next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
