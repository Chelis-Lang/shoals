name: nightly

# The scheduled real-chelis validation that does NOT belong on the per-PR
# path. Per-PR CI (ci.yml) stays LEAN: fmt + lint + the reef-build compile
# signal + the offline gates (hard-rule-guard, contract-gate). Everything
# real-chelis/real-SMT runs here, on two cadences:
#
#   * DAILY (03:00 UTC) — the gates moved off the per-PR path so they no
#     longer cost every PR ~17-19 min of real-chelis/real-SMT wall:
#       - `tests` : the fast deterministic unit suite (tests/, ~13 min).
#       - `prove` : the keystone canon self-audit (scripts/prove_gate.py,
#                   real-SMT ~8.6 min).
#   * WEEKLY (Sun 06:00 UTC) — the `heavy` matrix: the Monte-Carlo / PDE /
#     Fourier / optimization-benchmark files in tests-manual/, sharded one
#     leg per file so no single leg approaches the 2-vCPU ubuntu-latest
#     runner's reclaim window (a single-invocation run of the whole directory
#     was SIGTERM-killed, exit 143, at ~54 min before its own step timeout).
#     Deliberately not daily: it is the heaviest, most runner-hostile suite.
#   * workflow_dispatch runs ALL THREE tiers on demand.
#
# Toolchain versions are derived from reef.toml, same as ci.yml.
#
# The milestone acceptance oracles (scripts/manual_gates/phase3l_*.py) are
# a MANUAL gate — run on demand / locally, deliberately NOT scheduled in
# CI: each spawns a fresh `chelis test` that rebuilds the chelis-std +
# nautilus + coral graph (recompile-bound), the wrong shape for a CI step.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily — the `tests` + `prove` gates
    - cron: '0 6 * * 0'   # 06:00 UTC Sundays (weekly) — the `heavy` matrix
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# Literal chelis pin. MUST equal reef.toml `compiler = "=X.Y.Z"`;
# scripts/audit_workarounds.py --pins-only enforces it offline. The extract
# step re-derives the pin from reef.toml only to assert this has not drifted.
env:
  CHELIS_TAG: v0.18.9
  CHELIS_VERSION: 0.18.9

jobs:
  # The fast deterministic unit suite (tests/) — moved off the per-PR path.
  # ~13 min of real-chelis wall on the 2-vCPU runner: the tallest slice of the
  # old per-PR gate. Runs DAILY (and on workflow_dispatch). This is the
  # per-PR-derived fast suite; the heavy tests-manual/ suite is the weekly
  # `heavy` matrix below.
  tests:
    name: tests (fast unit suite)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          # chelis pin comes from the literal top-level env; re-derive from
          # reef.toml only to assert it has not drifted (reef.toml is truth).
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"

      - name: chelis reef build
        run: chelis reef build

      # Budget raised at the 0.18.6 pin to work around chelis#1391, which is
      # OPEN upstream -- this is a narrowing, not a fix. The default
      # `--batch-mode auto` path went from 3m01s to 7m54s on the same 43 files,
      # 371 tests, and one quiet 10-core machine with warm caches, so the old
      # 1500s/30min budget no longer has headroom on a 2-vCPU hosted runner.
      # This raises the budget ONLY. `--batch-mode file` measured more than
      # twice as fast locally (3m44s), but switching it here would change what
      # CI exercises on evidence taken from different hardware; lower this back
      # and drop the raise when the upstream regression closes.
      - name: chelis test (tests/ fast unit suite)
        timeout-minutes: 45
        run: chelis test tests/ --timeout 1200 --suite-timeout 2400 --jobs auto

  # The keystone canon self-audit against the pinned RELEASE binary — moved
  # off the per-PR path. Real-SMT ~8.6 min (the reef package load alone is
  # multi-minute; prove_gate has no cheap subset to smoke). Runs DAILY (and on
  # workflow_dispatch).
  #
  # This is the complete active canon: deterministic SMT lanes plus the
  # explicitly seeded fuzz-validated direct-pricer lane promoted when
  # chelis#659 closed at 0.17.4. The fuzz lane's expected tier, controls,
  # compiler attribution, sample budget, and counterexamples are enforced by
  # prove_gate; it is never presented as a proof.
  prove:
    name: prove-gate (canon self-audit)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"

      - name: chelis reef build
        run: chelis reef build

      - name: prove_gate (complete SMT and fuzz-validated canon)
        env:
          PROVE_GATE_FUZZ: "1"
        run: python3 scripts/prove_gate.py

      - name: Verify package prove latency and deterministic output (chelis#924)
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: python3 scripts/check_package_prove_latency.py

  heavy:
    name: heavy ${{ matrix.file }}
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - composites_binding_heavy
          - greeks_secondorder
          - heston
          - heston_heavy
          - hull_white
          - hull_white_heavy
          - lsm_heavy
          - modelfit_bfgs
          # modelfit_bfgs_heavy excluded pending chelis#408: its BFGS path
          # (mf_bfgs_rec Rosenbrock 500-iter + FD Jacobian + CG) kills the
          # 2-vCPU GitHub runner ~4min in (shutdown/lost-communication, no
          # output). Passes locally; re-add this leg when chelis#408 is fixed.
          - modelfit_pipeline
          - modelfit_pipeline_heavy
          - pde_heavy
          - rng_heavy
          - sabrpaths_heavy
          - stochastic_kou_heavy
          - trees
          - trees_heavy
          - xva_wwr_heavy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          # chelis pin comes from the literal top-level env; re-derive from
          # reef.toml only to assert it has not drifted (reef.toml is truth).
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"

      - name: chelis reef build
        run: chelis reef build

      # One heavy file per matrix leg. `--jobs` controls cross-FILE worker
      # parallelism, so with a single file it buys no speedup — but `--jobs
      # auto` still forks worker processes that add CPU/memory pressure on the
      # 2-vCPU ubuntu-latest runner. That pressure twice killed the heaviest
      # leg with a runner-level death ("lost communication ... starves it for
      # CPU/Memory"), so pin `--jobs 1` to run in-process with no extra
      # workers; the tests in a file already run serially regardless.
      #
      # The slowest individual tests — the modelfit pipeline FD-bump (~12
      # serial 2-stage LM solves) and the 256-path SABR correlation MC — run
      # past 600s on 2 vCPUs, so the per-test budget is 1500s (the whole
      # monolith previously used 1800s without a per-test timeout). These tests
      # cannot be shrunk without weakening their numerical/statistical oracle.
      #
      # Step ceiling 30 min: a heavy leg builds + tests in ~7-23 min, and the
      # Chelis 0.17.4 also has an independent 600s whole-suite watchdog. Set it
      # to 1650s so the reviewed long-running tests can complete, while keeping
      # it below the 30-minute step ceiling. The 1500s per-test bound still
      # guards every individual oracle. A rare overrun surfaces via the report
      # job rather than being masked by a huge ceiling.
      - name: chelis test (tests-manual/${{ matrix.file }}.ch)
        timeout-minutes: 30
        run: chelis test "tests-manual/${{ matrix.file }}.ch" --timeout 1500 --suite-timeout 1650 --jobs 1

  # Surface a nightly failure as a tracking issue (opens on failure, closes
  # on green) so a red nightly is impossible to miss — scheduled-run
  # failures do not show a red status on main, which is how the heavy
  # nightly stayed red unnoticed. `needs` all three real-chelis jobs;
  # `if: always()` so it runs regardless of outcome.
  report:
    name: Surface nightly status
    needs: [tests, prove, heavy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/close nightly-failure tracking issue
        uses: actions/github-script@v7
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          PROVE_RESULT: ${{ needs.prove.result }}
          HEAVY_RESULT: ${{ needs.heavy.result }}
        with:
          script: |
            const title = 'Nightly failing: shoals';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Jobs that did not run on this cadence report 'skipped' (daily runs
            // skip `heavy`; the weekly run skips `tests`/`prove`) — not a
            // failure. Only success|skipped are OK; anything else (failure,
            // cancelled, timed_out) is a real nightly failure.
            const results = {
              tests: process.env.TESTS_RESULT,
              prove: process.env.PROVE_RESULT,
              heavy: process.env.HEAVY_RESULT,
            };
            const failedJobs = Object.entries(results)
              .filter(([, r]) => r !== 'success' && r !== 'skipped')
              .map(([n, r]) => `${n}=${r}`);
            const failed = failedJobs.length > 0;
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            const existing = found.data.items.find(i => i.title === title);
            if (failed) {
              if (existing) {
                core.info(`Tracking issue #${existing.number} already open.`);
              } else {
                const issue = await github.rest.issues.create({
                  owner, repo, title,
                  body: `The **nightly** suite failed (${failedJobs.join(', ')}).\n\nRun: ${runUrl}\nCommit: \`${context.sha}\`\n\nAuto-opened on failure; auto-closes when the nightly next passes.`,
                  labels: ['nightly-failure'],
                });
                core.info(`Opened tracking issue #${issue.data.number}.`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Nightly green again — ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`Closed tracking issue #${existing.number}.`);
            }
