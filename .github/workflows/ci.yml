name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download v0.6.1 \
            --repo Chelis-Lang/chelis \
            --pattern 'chelis-v0.6.1-linux-x86_64.tar.gz' \
            --dir /tmp/chelis-toolchain
          tar -xzf /tmp/chelis-toolchain/chelis-v0.6.1-linux-x86_64.tar.gz \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-v0.6.1-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: |
          chelis --version
          test "$(chelis --version)" = "chelis 0.6.1"

      - name: Populate reef registry (chelis-std + nautilus + coral)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          COMPILER_PIN=$(grep '^compiler' reef.toml | sed 's/.*"\(.*\)"/\1/')

          # chelis-std lives in the chelis monorepo's prebuilt artifact
          # tree; download the matching source tag and publish from there.
          rm -rf /tmp/chelis-monorepo-for-std
          mkdir -p /tmp/chelis-monorepo-for-std
          gh api repos/Chelis-Lang/chelis/tarball/v0.6.1 \
            > /tmp/chelis-monorepo-for-std.tar.gz
          tar -xzf /tmp/chelis-monorepo-for-std.tar.gz \
            -C /tmp/chelis-monorepo-for-std --strip-components=1
          chelis reef install --from-monorepo \
            /tmp/chelis-monorepo-for-std chelis-std

          # Nautilus 0.6.0 from its release.
          mkdir -p /tmp/reef-deps/nautilus-dl /tmp/reef-deps/nautilus
          gh release download v0.6.1 \
            --repo Chelis-Lang/nautilus \
            --pattern 'nautilus-0.6.1.tar.zst' \
            --dir /tmp/reef-deps/nautilus-dl
          tar -xf /tmp/reef-deps/nautilus-dl/nautilus-0.6.1.tar.zst \
            -C /tmp/reef-deps/nautilus
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/nautilus/reef.toml
          chelis reef publish /tmp/reef-deps/nautilus

          # Coral 0.6.0 from its release.
          mkdir -p /tmp/reef-deps/coral-dl /tmp/reef-deps/coral
          gh release download v0.6.1 \
            --repo Chelis-Lang/coral \
            --pattern 'coral-0.6.1.tar.zst' \
            --dir /tmp/reef-deps/coral-dl
          tar -xf /tmp/reef-deps/coral-dl/coral-0.6.1.tar.zst \
            -C /tmp/reef-deps/coral
          sed -i "s|compiler = \".*\"|compiler = \"$COMPILER_PIN\"|" \
            /tmp/reef-deps/coral/reef.toml
          chelis reef publish /tmp/reef-deps/coral

      - name: chelis fmt --check
        run: |
          set -euo pipefail
          for f in src/*.ch properties/*.ch references/*.ch tests/*.ch; do
            [ -e "$f" ] || continue
            chelis fmt --check "$f"
          done

      - name: chelis reef build
        run: chelis reef build
