name: ci

on:
  push:
    branches: [main, shoals-grad]
  pull_request:
    branches: [main, shoals-grad]
  workflow_dispatch:

env:
  CHELIS_TAG: v0.7.11
  CHELIS_VERSION: 0.7.11
  NAUTILUS_TAG: v0.7.13
  CORAL_TAG: v0.7.13

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned chelis toolchain
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          gh release download "$CHELIS_TAG" \
            --repo Chelis-Lang/chelis \
            --pattern "chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            --dir /tmp/chelis-toolchain
          tar -xzf "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64.tar.gz" \
            -C /tmp/chelis-toolchain
          echo "/tmp/chelis-toolchain/chelis-${CHELIS_TAG}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain version
        run: test "$(chelis --version)" = "chelis ${CHELIS_VERSION}"

      - name: Install released dependencies
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          chelis reef install --from-github "Chelis-Lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "Chelis-Lang/coral@${CORAL_TAG}"

      - name: chelis fmt --check
        run: |
          set -euo pipefail
          for f in src/*.ch properties/*.ch references/*.ch tests/*.ch; do
            [ -e "$f" ] || continue
            chelis fmt --check "$f"
          done

      - name: chelis reef build
        run: chelis reef build

      - name: chelis test (node-local parallel)
        run: chelis test tests/ --timeout 120 --jobs auto
