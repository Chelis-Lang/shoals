name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Literal chelis pin. MUST equal the reef.toml `compiler = "=X.Y.Z"` pin;
# scripts/audit_workarounds.py --pins-only enforces that offline (the
# reef-derived grep in the extract step can't be evaluated without a checkout,
# so a literal has to exist for the guard to check). The extract step below
# re-derives the pin from reef.toml only to assert this literal has not drifted.
env:
  CHELIS_TAG: v0.19.1
  CHELIS_VERSION: 0.19.1

jobs:
  hard-rule-guard:
    name: hard-rule-guard (offline pin consistency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit pin consistency (offline)
        run: python3 scripts/audit_workarounds.py --pins-only

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so `conform bump-check --base origin/main` can resolve
          # the base pin; the default shallow clone would fail closed.
          fetch-depth: 0

      - name: Extract versions from reef.toml
        run: |
          set -euo pipefail
          # chelis pin comes from the literal top-level env (CHELIS_TAG /
          # CHELIS_VERSION); re-derive it from reef.toml only to assert the
          # literal has not drifted. reef.toml stays the single source of truth.
          REEF_CHELIS=$(grep -oP '^compiler\s*=\s*"=\K[0-9]+\.[0-9]+\.[0-9]+' reef.toml)
          NAUTILUS_VERSION=$(grep -A0 '^nautilus' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          CORAL_VERSION=$(grep -A0 '^coral' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          SHORELEAVE_VERSION=$(grep -A0 '^shoreleave' reef.toml | grep -oP 'version\s*=\s*"=?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$REEF_CHELIS" ] || [ -z "$NAUTILUS_VERSION" ] || [ -z "$CORAL_VERSION" ] || [ -z "$SHORELEAVE_VERSION" ]; then
            echo "Failed to parse one or more versions from reef.toml" >&2
            cat reef.toml >&2
            exit 1
          fi
          if [ "$REEF_CHELIS" != "$CHELIS_VERSION" ]; then
            echo "Pin drift: reef.toml chelis=$REEF_CHELIS but literal CHELIS_VERSION=$CHELIS_VERSION" >&2
            echo "Bump the top-level env pin and reef.toml together (scripts/audit_workarounds.py --pins-only)." >&2
            exit 1
          fi
          echo "NAUTILUS_TAG=v$NAUTILUS_VERSION" >> "$GITHUB_ENV"
          echo "CORAL_TAG=v$CORAL_VERSION"       >> "$GITHUB_ENV"
          echo "SHORELEAVE_TAG=v$SHORELEAVE_VERSION"       >> "$GITHUB_ENV"
          echo "Detected: chelis=$CHELIS_VERSION (literal, ==reef) nautilus=$NAUTILUS_VERSION coral=$CORAL_VERSION shoreleave=$SHORELEAVE_VERSION"

      - name: Install chelis toolchain (cached)
        id: chelis
        uses: ./.github/actions/install-chelis
        with:
          chelis-tag: ${{ env.CHELIS_TAG }}
          chelis-version: ${{ env.CHELIS_VERSION }}
          gh-token: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          reef-cache-key: nautilus-${{ env.NAUTILUS_TAG }}-coral-${{ env.CORAL_TAG }}-shoreleave-${{ env.SHORELEAVE_TAG }}

      - name: Install released dependencies
        if: steps.chelis.outputs.reef-cache-hit != 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CHELIS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Canonical lowercase owner is a release-byte narrowing for chelis#1002.
          chelis reef install --from-github "chelis-lang/nautilus@${NAUTILUS_TAG}"
          chelis reef install --from-github "chelis-lang/coral@${CORAL_TAG}"
          chelis reef install --from-github "chelis-lang/shoreleave@${SHORELEAVE_TAG}"

      - name: chelis fmt --check
        run: |
          set -euo pipefail
          # globstar so tests_neg/tests_blocked cases are found at any depth
          # (the test runner discovers them recursively; fmt must match).
          shopt -s globstar
          for f in src/*.ch properties/*.ch references/*.ch demos/*.ch tests/*.ch tests-manual/*.ch tests_neg/**/*.ch tests_blocked/**/*.ch; do
            [ -e "$f" ] || continue
            chelis fmt --check "$f"
          done

      - name: Test secret scan contract
        run: python3 -m unittest discover -v -s .github/scripts -p test_secret_scan.py

      - name: chelis lint --check
        run: chelis lint --check src/ properties/ references/ demos/ tests/ tests-manual/ manual-gates/ tests_neg/ tests_blocked/

      - name: chelis reef build
        run: chelis reef build

      - name: Validate Black-Scholes WireDag root (shoals#19)
        run: python3 scripts/validate_bs_wire_root.py

      # Contract §5/§6 expected-failure suites: seconds each (per-file
      # isolated), so they stay on the lean per-PR path.
      - name: Negative tests
        run: chelis test tests_neg/ --expect neg

      # `--expect blocked` errors on an empty suite (a guard running zero
      # probes would be silently green), and tests_blocked/ is legitimately
      # empty whenever every pinned blocker has been de-narrowed. Skip the
      # step in exactly that case; any probe added here runs with no further
      # wiring. See tests_blocked/README.md.
      - name: Blocked-probe suite
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          probes=(tests_blocked/**/*.ch)
          if [ ${#probes[@]} -eq 0 ]; then
            echo "tests_blocked/ carries no probes; skipping (see tests_blocked/README.md)."
            exit 0
          fi
          chelis test tests_blocked/ --expect blocked

      # Contract §11 conformance + §7 pin-bump guard (toolchain-native since
      # chelis 0.15.1, chelis#628).
      - name: Conformance audit
        run: chelis reef conform audit

      - name: Pin-bump guard
        run: chelis reef conform bump-check --base origin/main

      # Shoals-only policy: numerical suites and benchmarks are optional
      # local tools. CI keeps compilation, short guards and offline checks.
      # This includes scheduled, manual and release workflows.

  # Build the rendered book and validate prose and repository signatures.
  # Runtime examples remain available locally via check_book_examples.py.
  book:
    name: book (mdbook build, lint, source signatures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2
      - name: Build mdBook
        run: mdbook build docs/book
      - name: Lint book and README
        run: python3 scripts/check_book.py docs/book/src README.md
      - name: Check book signatures against repository sources
        run: python3 scripts/check_book_examples.py --source-only
      - name: Validate source-only book checks
        run: python3 scripts/test_check_book_examples.py

  # Offline manifest validation (no toolchain): schema/pin freshness + every
  # invariant/control/output-fn/precondition resolves to real sources.
  contract-gate:
    name: contract-gate (offline manifest validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate the invariant-surface manifest
        run: python3 scripts/contract_gate.py
      - name: Run adversarial risk invariant gate regressions
        run: python3 scripts/test_risk_invariant_gate.py
      - name: Validate canonical release builder (chelis#1002)
        run: python3 scripts/test_build_release_assets.py
      - name: Validate the chelis#924 release oracle
        run: python3 scripts/test_check_package_prove_latency.py
      - name: Validate bounded pricing property-result classification
        run: python3 scripts/test_check_pricing_fix_properties.py
      - name: Validate the LSM accuracy oracle
        run: python3 scripts/test_check_lsm_accuracy.py
      - name: Validate the spread PDE accuracy oracle
        run: python3 scripts/test_spread_adi_oracle.py
      - name: Validate release workflow integrity contracts
        run: python3 scripts/test_release_workflow.py

      # Offline agreement of published figures. The optional local measurement
      # runner checks numerical accuracy against mpmath.
      - name: Accuracy-floor transcription (shoals#64)
        run: python3 scripts/oracle_erf64_accuracy.py --transcription
      - name: Validate the accuracy-floor oracle's own mutations (shoals#64)
        run: python3 scripts/test_oracle_erf64_accuracy.py
